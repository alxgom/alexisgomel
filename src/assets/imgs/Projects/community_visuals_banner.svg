<svg width="800" height="400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Sevilla Palette -->
    <style>
      .bg { fill: #f0eee9; }
      .red-stroke { stroke: #a50034; }
      .green-stroke { stroke: #115740; }
      .blue-stroke { stroke: #26619c; }
      .orange-stroke { stroke: #c77332; }
      
      .red-fill { fill: #a50034; }
      .green-fill { fill: #115740; }
      .blue-fill { fill: #26619c; }
      .orange-fill { fill: #c77332; }
    </style>
    
    <!-- Ceramic Pattern -->
    <pattern id="ceramicTile" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="none"/>
      <path d="M20 0 L25 5 L20 10 L15 5 Z" fill="#6f8b9b" opacity="0.1"/>
      <path d="M40 20 L35 25 L30 20 L35 15 Z" fill="#6f8b9b" opacity="0.1"/>
      <path d="M20 40 L25 35 L20 30 L15 35 Z" fill="#6f8b9b" opacity="0.1"/>
      <path d="M0 20 L5 25 L10 20 L5 15 Z" fill="#6f8b9b" opacity="0.1"/>
      <circle cx="20" cy="20" r="2" fill="#c77332" opacity="0.1"/>
    </pattern>
    
    <!-- Inner Circle Mask (Radius 58) -->
    <!-- This MUST align with the plate circle at cx=60, cy=70 -->
    <clipPath id="plateMask">
        <circle cx="60" cy="70" r="58" />
    </clipPath>
  </defs>

  <rect width="100%" height="100%" class="bg" />
  <rect width="100%" height="100%" fill="url(#ceramicTile)" />
  <rect width="100%" height="100%" fill="#fff" opacity="0.4" />
  
  <!-- Content Container -->
  
  <!-- Icon 1: Tree (Green Theme) - Centered at X=200 -->
  <g transform="translate(140, 130)">
    <!-- Plate Backgrounds -->
    <circle cx="60" cy="70" r="65" fill="#ffffff" stroke="#115740" stroke-width="2" />
    <circle cx="60" cy="70" r="58" fill="#fcfcfc" stroke="#115740" stroke-width="1" stroke-dasharray="4 2" opacity="0.3"/>
    
    <!-- Masked Content -->
    <!-- Apply clip-path here (0,0 relative to group) so it matches the plate -->
    <g clip-path="url(#plateMask)">
      <!-- Transform the ICON itself to be centered at 60,70 -->
      <!-- Icon Size ~73x72. Offset (23.5, 34) -->
      <g transform="translate(23.5, 34)">
        <rect x="4.5" y="31.5" width="22" height="8" rx="4" fill="#E8F5E9" stroke="#115740" stroke-linejoin="round"/>
        <rect x="46.5" y="40.5" width="22" height="8" rx="4" fill="#E8F5E9" stroke="#115740" stroke-linejoin="round"/>
        <rect x="46.5" y="22.5" width="22" height="8" rx="4" fill="#E8F5E9" stroke="#115740" stroke-linejoin="round"/>
        <path d="M26.5 35C26.5 35 31.6513 35.0918 36.5 30.5C41.3487 25.9082 46.5 26.5 46.5 26.5" stroke="#115740"/>
        <path d="M26.2406 35.9791C26.2406 35.9791 31.3919 35.8873 36.2407 40.4791C41.0894 45.071 46.2406 44.4791 46.2406 44.4791" stroke="#115740"/>
      </g>
    </g>
  </g>

  <!-- Icon 2: Lipstick (Red Theme) - Centered at X=400 -->
  <g transform="translate(340, 130)">
    <circle cx="60" cy="70" r="65" fill="#ffffff" stroke="#a50034" stroke-width="2" />
    <circle cx="60" cy="70" r="58" fill="#fcfcfc" stroke="#a50034" stroke-width="1" stroke-dasharray="4 2" opacity="0.3"/>
    
    <g clip-path="url(#plateMask)">
      <!-- Icon Size ~72x72. Offset (24, 34) -->
      <g transform="translate(24, 34)">
        <rect x="13.5" y="9.5" width="45" height="8" rx="4" fill="#FFEBEE" stroke="#a50034" stroke-linejoin="round"/>
        <rect x="13.5" y="9.5" width="29" height="8" rx="4" fill="#a50034" stroke="#a50034" stroke-linejoin="round"/>
        <rect x="13.5" y="31.5" width="45" height="8" rx="4" fill="#FFEBEE" stroke="#a50034" stroke-linejoin="round"/>
        <rect x="13.5" y="31.5" width="57" height="8" rx="4" fill="#a50034" stroke="#a50034" stroke-linejoin="round"/>
        <rect x="13.5" y="53.5" width="45" height="8" rx="4" fill="#FFEBEE" stroke="#a50034" stroke-linejoin="round"/>
        <rect x="13.5" y="53.5" width="17" height="8" rx="4" fill="#a50034" stroke="#a50034" stroke-linejoin="round"/>
      </g>
    </g>
  </g>

  <!-- Icon 3: Histogram (Blue Theme) - Centered at X=600 -->
  <g transform="translate(540, 130)">
    <circle cx="60" cy="70" r="65" fill="#ffffff" stroke="#26619c" stroke-width="2" />
    <circle cx="60" cy="70" r="58" fill="#fcfcfc" stroke="#26619c" stroke-width="1" stroke-dasharray="4 2" opacity="0.3"/>
    
    <g clip-path="url(#plateMask)">
      <!-- Icon Size ~72x72. Offset (24, 34) -->
      <g transform="translate(24, 34)">
        <rect x="10.5" y="39.4038" width="25.0962" height="8" rx="4" transform="rotate(90 10.5 39.4038)" fill="#E3F2FD" stroke="#26619c" stroke-linejoin="round"/>
        <rect x="25.5" y="20.1155" width="44.3846" height="8" rx="4" transform="rotate(90 25.5 20.1155)" fill="#E3F2FD" stroke="#26619c" stroke-linejoin="round"/>
        <rect x="40.5" y="6.5" width="58" height="8" rx="4" transform="rotate(90 40.5 6.5)" fill="#E3F2FD" stroke="#26619c" stroke-linejoin="round"/>
        <rect x="55.5" y="26.9231" width="37.5769" height="8" rx="4" transform="rotate(90 55.5 26.9231)" fill="#E3F2FD" stroke="#26619c" stroke-linejoin="round"/>
        <rect x="70.5" y="45.0769" width="19.4231" height="8" rx="4" transform="rotate(90 70.5 45.0769)" fill="#E3F2FD" stroke="#26619c" stroke-linejoin="round"/>
      </g>
    </g>
  </g>
  
  <rect x="0" y="0" width="800" height="12" class="blue-fill" opacity="0.9" />
  <rect x="0" y="388" width="800" height="12" class="blue-fill" opacity="0.9" />
  <rect x="0" y="12" width="800" height="4" class="orange-fill" opacity="0.9" />
  <rect x="0" y="384" width="800" height="4" class="orange-fill" opacity="0.9" />
</svg>
