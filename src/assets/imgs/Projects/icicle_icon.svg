<?xml version="1.0" encoding="UTF-8"?>
<svg width="200" height="200" viewBox="0 0 200 200" version="1.1" xmlns="http://www.w3.org/2000/svg">
    <!-- Background -->
    <rect x="0" y="0" width="200" height="200" fill="#FFFFFF" />
    
    <!-- Icicle Structure (3 Layers Total) -->
    <!-- Layer 1: Root -->
    <rect x="10" y="10" width="180" height="55" rx="2" fill="#0B5394" />
    
    <!-- Layer 2: Mid -->
    <rect x="10" y="72" width="100" height="55" rx="2" fill="#3D85C6" />
    <rect x="115" y="72" width="75" height="55" rx="2" fill="#3D85C6" />
    
    <!-- Layer 3: Bottom -->
    <rect x="10" y="135" width="40" height="55" rx="2" fill="#A4C2F4" />
    <rect x="55" y="135" width="55" height="55" rx="2" fill="#A4C2F4" />
    <rect x="115" y="135" width="75" height="55" rx="2" fill="#A4C2F4" />
</svg>
