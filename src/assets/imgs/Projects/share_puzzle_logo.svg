<svg width="320" height="200" viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1"></feGaussianBlur>
      <feOffset dx="1" dy="1" result="offsetblur"></feOffset>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"></feFuncA>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode></feMergeNode>
        <feMergeNode in="SourceGraphic"></feMergeNode>
      </feMerge>
    </filter>
  </defs>
  <style>
    .puzzle-piece {
      animation: assemble 6s infinite ease-in-out;
      transform-origin: center;
      opacity: 0;
    }

    @keyframes assemble {
      0% {
        opacity: 0;
        transform: translate(var(--tx), var(--ty)) scale(0.8) rotate(var(--rot));
      }
      15% {
        opacity: 1;
        transform: translate(0, 0) scale(1) rotate(0deg);
      }
      85% {
        opacity: 1;
        transform: translate(0, 0) scale(1) rotate(0deg);
      }
      100% {
        opacity: 0;
        transform: translate(var(--tx), var(--ty)) scale(0.8) rotate(var(--rot));
      }
    }

    /* Staggered delays for a nice effect */
    .p1 { animation-delay: 0s; --tx: -40px; --ty: -40px; --rot: -15deg; }
    .p2 { animation-delay: 0.1s; --tx: 40px; --ty: -40px; --rot: 15deg; }
    .p3 { animation-delay: 0.2s; --tx: -40px; --ty: 10px; --rot: -10deg; }
    .p4 { animation-delay: 0.3s; --tx: 40px; --ty: 10px; --rot: 10deg; }
    .p5 { animation-delay: 0.4s; --tx: 0px; --ty: 40px; --rot: 0deg; }
  </style>

  <g id="puzzleGroup" stroke="black" stroke-width="1.5" stroke-linejoin="round" transform="translate(160, 100) scale(0.7) translate(-100, -100)">
    <!-- Top Left: Almegre Red (#A50034) -->
    <path class="puzzle-piece p1" d="M 100 20L 40 80L 61.0 80.0 C 61.0 83.0 64.0 89.0 58.0 95.0 C 52.0 101.0 88.0 101.0 82.0 95.0 C 76.0 89.0 79.0 83.0 79.0 80.0 L 100.0 80.0L 121.0 80.0 C 121.0 83.0 124.0 89.0 118.0 95.0 C 112.0 101.0 148.0 101.0 142.0 95.0 C 136.0 89.0 139.0 83.0 139.0 80.0 L 160.0 80.0L 100 20 Z" fill="#A50034" filter="url(#dropShadow)"></path>

    <!-- Mid Left: Triana Green (#115740) -->
    <path class="puzzle-piece p3" d="M 40 80L 40 130L 61.0 130.0 C 61.0 133.0 64.0 139.0 58.0 145.0 C 52.0 151.0 88.0 151.0 82.0 145.0 C 76.0 139.0 79.0 133.0 79.0 130.0 L 100.0 130.0L 100.0 112.5 C 102.5 112.5 107.5 110.0 112.5 115.0 C 117.5 120.0 117.5 90.0 112.5 95.0 C 107.5 100.0 102.5 97.5 100.0 97.5 L 100.0 80.0L 79.0 80.0 C 79.0 83.0 76.0 89.0 82.0 95.0 C 88.0 101.0 52.0 101.0 58.0 95.0 C 64.0 89.0 61.0 83.0 61.0 80.0 L 40.0 80.0 Z" fill="#115740" filter="url(#dropShadow)"></path>

    <!-- Top Right: Lapiz Lazuli (#26619C) -->
    <path class="puzzle-piece p2" d="M 100 80L 100.0 97.5 C 102.5 97.5 107.5 100.0 112.5 95.0 C 117.5 90.0 117.5 120.0 112.5 115.0 C 107.5 110.0 102.5 112.5 100.0 112.5 L 100.0 130.0L 121.0 130.0 C 121.0 133.0 124.0 139.0 118.0 145.0 C 112.0 151.0 148.0 151.0 142.0 145.0 C 136.0 139.0 139.0 133.0 139.0 130.0 L 160.0 130.0L 160 80L 139.0 80.0 C 139.0 83.0 136.0 89.0 142.0 95.0 C 148.0 101.0 112.0 101.0 118.0 95.0 C 124.0 89.0 121.0 83.0 121.0 80.0 L 100.0 80.0 Z" fill="#26619C" filter="url(#dropShadow)"></path>

    <!-- Bottom Left: Albero Pantone (#FFAB60) - Actually this is Mid Right path logic from original SVG order, but let's check -->
    <!-- Path 4 in original SVG was bottom left? No, let's re-verify paths visually based on coordinates -->
    <!--
      Path 1: Moves to 100,20 (Top center), L 40,80 (Left), L 160,80 (Right). This is the ROOF.
          Wait, Path 1 in original had M 100 20 L 40 80 ... L 160 80. It covers the full top width?
          Let's assume Path 1 is the big roof piece.
      Path 2 (originally): M 40 80 ... This is left side middle.
      Path 3 (originally): M 100 80 ... This is right side middle.
      Path 4 (originally): M 40 130 ... Bottom Left block.
      Path 5 (originally): M 100 130 ... Bottom Right block.
    -->
    
    <!-- Redefining mapping based on standard house puzzle shape -->
    <!-- Piece 1 (Roof): Almegre Red (#A50034) -->
    <!-- The d="..." for the first path is mostly correct for the top piece. -->
    
    <!-- Let's map the 5 original paths to 5 colors -->
    <!-- Original Path 1 (Roof): Almegre Red (#A50034) -->
    <!-- Original Path 2 (Left Mid): Triana Green (#115740) -->
    <!-- Original Path 3 (Right Mid): Lapiz Lazuli (#26619C) -->
    <!-- Original Path 4 (Bottom Left): Albero Pantone (#FFAB60) -->
    <!-- Original Path 5 (Bottom Right): Cloud Dance (#F0EEE9) -->

    <!-- Using the d attributes from the original file exactly to ensure they fit -->
     
    <!-- Path 4: Bottom Left -->
    <path class="puzzle-piece p4" d="M 40 130L 40 180L 100 180L 100.0 162.5 C 102.5 162.5 107.5 160.0 112.5 165.0 C 117.5 170.0 117.5 140.0 112.5 145.0 C 107.5 150.0 102.5 147.5 100.0 147.5 L 100.0 130.0L 79.0 130.0 C 79.0 133.0 76.0 139.0 82.0 145.0 C 88.0 151.0 52.0 151.0 58.0 145.0 C 64.0 139.0 61.0 133.0 61.0 130.0 L 40.0 130.0 Z" fill="#FFAB60" filter="url(#dropShadow)"></path>

    <!-- Path 5: Bottom Right -->
    <path class="puzzle-piece p5" d="M 100 130L 100.0 147.5 C 102.5 147.5 107.5 150.0 112.5 145.0 C 117.5 140.0 117.5 170.0 112.5 165.0 C 107.5 160.0 102.5 162.5 100.0 162.5 L 100.0 180.0L 160 180L 160 130L 139.0 130.0 C 139.0 133.0 136.0 139.0 142.0 145.0 C 148.0 151.0 112.0 151.0 118.0 145.0 C 124.0 139.0 121.0 133.0 121.0 130.0 L 100.0 130.0 Z" fill="#F0EEE9" filter="url(#dropShadow)"></path>

  </g>
</svg>
