<svg width="400" height="400" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Glow Gradient -->
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </radialGradient>

    <!-- Center Label Gradient -->
    <radialGradient id="labelGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a1a1a" />
      <stop offset="100%" stop-color="#000" />
    </radialGradient>

    <!-- Refined Bar Gradient -->
    <linearGradient id="barGrad" x1="200" y1="140" x2="200" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="200" cy="200" r="180" fill="url(#glowGrad)">
    <animate attributeName="opacity" values="0.2;0.4;0.2" dur="5s" repeatCount="indefinite" />
  </circle>

  <!-- The Spinning Vinyl Group -->
  <g>
    <animateTransform 
      attributeName="transform" 
      type="rotate" 
      from="0 200 200" 
      to="360 200 200" 
      dur="18s" 
      repeatCount="indefinite" 
    />

    <!-- Main Disc Body -->
    <circle cx="200" cy="200" r="160" fill="#0a0a0a" stroke="#171717" stroke-width="8" />
    
    <!-- Minimalist Groove Rings -->
    <g opacity="0.1" stroke="#4a4a4a" fill="none">
      <circle cx="200" cy="200" r="150" />
      <circle cx="200" cy="200" r="125" />
      <circle cx="200" cy="200" r="100" />
      <circle cx="200" cy="200" r="75" />
    </g>

    <!-- Data Mask / Energy Bars (Balanced Density) -->
    <g stroke="url(#barGrad)" stroke-width="6.5" stroke-linecap="round">
      <!-- 
        Balanced density: Every 15 degrees (24 bars total).
        Outer point (y2) varied between 80 and 125 for a natural "data" flow.
      -->
      <line x1="200" y1="140" x2="200" y2="90" transform="rotate(0, 200, 200)" />
      <line x1="200" y1="140" x2="200" y2="110" transform="rotate(15, 200, 200)" />
      <line x1="200" y1="140" x2="200" y2="80" transform="rotate(30, 200, 200)" />
      <line x1="200" y1="140" x2="200" y2="120" transform="rotate(45, 200, 200)" />
      <line x1="200" y1="140" x2="200" y2="95" transform="rotate(60, 200, 200)" />
      <line x1="200" y1="140" x2="200" y2="115" transform="rotate(75, 200, 200)" />
      <line x1="200" y1="140" x2="200" y2="85" transform="rotate(90, 200, 200)" />
      <line x1="200" y1="140" x2="200" y2="125" transform="rotate(105, 200, 200)" />
      <line x1="200" y1="140" x2="200" y2="90" transform="rotate(120, 200, 200)" />
      <line x1="200" y1="140" x2="200" y2="110" transform="rotate(135, 200, 200)" />
      <line x1="200" y1="140" x2="200" y2="100" transform="rotate(150, 200, 200)" />
      <line x1="200" y1="140" x2="200" y2="120" transform="rotate(165, 200, 200)" />
      <line x1="200" y1="140" x2="200" y2="85" transform="rotate(180, 200, 200)" />
      <line x1="200" y1="140" x2="200" y2="115" transform="rotate(195, 200, 200)" />
      <line x1="200" y1="140" x2="200" y2="95" transform="rotate(210, 200, 200)" />
      <line x1="200" y1="140" x2="200" y2="125" transform="rotate(225, 200, 200)" />
      <line x1="200" y1="140" x2="200" y2="80" transform="rotate(240, 200, 200)" />
      <line x1="200" y1="140" x2="200" y2="110" transform="rotate(255, 200, 200)" />
      <line x1="200" y1="140" x2="200" y2="90" transform="rotate(270, 200, 200)" />
      <line x1="200" y1="140" x2="200" y2="120" transform="rotate(285, 200, 200)" />
      <line x1="200" y1="140" x2="200" y2="85" transform="rotate(300, 200, 200)" />
      <line x1="200" y1="140" x2="200" y2="115" transform="rotate(315, 200, 200)" />
      <line x1="200" y1="140" x2="200" y2="100" transform="rotate(330, 200, 200)" />
      <line x1="200" y1="140" x2="200" y2="125" transform="rotate(345, 200, 200)" />
    </g>

    <!-- Center Label -->
    <circle cx="200" cy="200" r="56" fill="url(#labelGrad)" stroke="#000000" stroke-width="4" />
    
    <!-- Spindle Hole -->
    <circle cx="200" cy="200" r="7" fill="#000" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
  </g>

  <!-- Tonearm (Static Overlay) -->
  <g transform="translate(320, 40) rotate(18)">
    <path d="M40 0 L40 100 L-10 120" stroke="#f1f5f9" stroke-width="5" stroke-linecap="round" fill="none" />
    <rect x="-18" y="112" width="24" height="14" rx="2" fill="#334155" transform="rotate(-20 -6 119)" />
    <circle cx="40" cy="0" r="10" fill="#020617" stroke="#475569" stroke-width="3" />
  </g>
</svg>