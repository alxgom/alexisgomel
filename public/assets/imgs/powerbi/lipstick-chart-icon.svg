<svg width="300" height="300" viewBox="0 0 300 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Row 1: track + bar (80% full) + target marker -->
  <rect x="30" y="48" width="210" height="44" rx="22" fill="#e8e8e8"/>
  <rect x="30" y="48" width="156" height="44" rx="22" fill="#4285F4"/>
  <line x1="178" y1="40" x2="178" y2="100" stroke="#111111" stroke-width="6" stroke-linecap="round"/>

  <!-- Row 2: track + bar (55% full) + target marker -->
  <rect x="30" y="128" width="210" height="44" rx="22" fill="#e8e8e8"/>
  <rect x="30" y="128" width="108" height="44" rx="22" fill="#4285F4"/>
  <line x1="178" y1="120" x2="178" y2="180" stroke="#111111" stroke-width="6" stroke-linecap="round"/>

  <!-- Row 3: track + bar (100%+, over target) + target marker -->
  <rect x="30" y="208" width="210" height="44" rx="22" fill="#e8e8e8"/>
  <rect x="30" y="208" width="210" height="44" rx="22" fill="#4285F4"/>
  <line x1="178" y1="200" x2="178" y2="260" stroke="#111111" stroke-width="6" stroke-linecap="round"/>
</svg>
