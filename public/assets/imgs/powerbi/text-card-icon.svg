<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="64" height="64" fill="none">
  <!-- Rounded card body -->
  <rect x="2" y="3" width="20" height="18" rx="3" stroke="#3b82f6" stroke-width="2" fill="#eff6ff"/>
  <!-- Card Header Line -->
  <line x1="5" y1="7" x2="13" y2="7" stroke="#3b82f6" stroke-width="2" stroke-linecap="round"/>
  <!-- Metric Pill indicator -->
  <rect x="15" y="6" width="4" height="2" rx="1" fill="#3b82f6"/>
  <!-- Body text lines -->
  <line x1="5" y1="11" x2="19" y2="11" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="5" y1="14" x2="19" y2="14" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="5" y1="17" x2="12" y2="17" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
</svg>
